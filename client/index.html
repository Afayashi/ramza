<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>رمز الإبداع - إدارة الأملاك</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <div id="err" style="display:none;position:fixed;top:0;left:0;right:0;padding:20px;background:#dc2626;color:white;font-family:monospace;font-size:13px;z-index:9999;white-space:pre-wrap"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        // تجاهل الأخطاء الغير حرجة من المتصفح
        if (typeof msg === 'string' && (
          msg.indexOf('ResizeObserver') !== -1 ||
          msg.indexOf('Script error') !== -1 ||
          msg.indexOf('Non-Error promise rejection') !== -1
        )) return true;
        var d = document.getElementById('err');
        d.style.display = 'block';
        d.textContent = 'JS Error: ' + msg + '\n' + (err && err.stack ? err.stack : '') + '\nAt: ' + src + ':' + line;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.getElementById('err');
        d.style.display = 'block';
        d.textContent = (d.textContent || '') + '\nPromise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
