name: Deploy to Cloudflare Pages + D1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          VITE_ADMIN_PASSWORD_HASH: ${{ secrets.VITE_ADMIN_PASSWORD_HASH }}
        run: npm run build

      - name: Create D1 Database (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "
            const d=require('fs').readFileSync('/dev/stdin','utf-8');
            try { const arr=JSON.parse(d); const db=arr.find(x=>x.name==='ramza-db'); process.stdout.write(db?db.uuid:''); } catch(e){}
          ")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database ramza-db..."
            DB_JSON=$(npx wrangler d1 create ramza-db --json 2>/dev/null)
            DB_ID=$(echo "$DB_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf-8');try{const j=JSON.parse(d);process.stdout.write(j.uuid||j.id||'');}catch(e){}")
            echo "Created DB: $DB_ID"
          else
            echo "DB exists: $DB_ID"
          fi
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV
          # Update wrangler.toml with real DB ID
          sed -i "s/placeholder-will-be-replaced-after-first-deploy/$DB_ID/g" wrangler.toml

      - name: Run D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute ramza-db --remote --file=migrations/0001_schema.sql || true
          npx wrangler d1 execute ramza-db --remote --file=migrations/0002_seed.sql || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist/public \
            --project-name=ramza \
            --branch=main \
            --commit-dirty=true
