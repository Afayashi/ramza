name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sharp-ride-GM7VL, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE44_API_KEY: ${{ secrets.VITE_BASE44_API_KEY }}
          VITE_TAQNYAT_BEARER: ${{ secrets.VITE_TAQNYAT_BEARER }}
          VITE_TAQNYAT_SENDER: ${{ secrets.VITE_TAQNYAT_SENDER }}
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          force_orphan: true
