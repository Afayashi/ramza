name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # The repository allows only actions owned by Afayashi, so the workflow
      # intentionally uses native runner commands instead of third-party actions.
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE44_API_KEY: ${{ secrets.VITE_BASE44_API_KEY }}
          VITE_TAQNYAT_BEARER: ${{ secrets.VITE_TAQNYAT_BEARER }}
          VITE_TAQNYAT_SENDER: ${{ secrets.VITE_TAQNYAT_SENDER }}
          VITE_ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          VITE_ADMIN_PASSWORD_HASH: ${{ secrets.VITE_ADMIN_PASSWORD_HASH }}
        run: npm run build

      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
